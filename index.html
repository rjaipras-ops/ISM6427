<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather</title>
  <script>
    // Apply the saved theme before the page paints to avoid a flash
    try {
      document.documentElement.dataset.theme = localStorage.getItem("theme") || "system";
    } catch {
      document.documentElement.dataset.theme = "system";
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div id="greeting" class="greeting">Hello, Rajesh Jaiprashad</div>
      <div class="glass themes" role="group" aria-label="Theme">
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="dark">Dark</button>
        <button type="button" data-theme="system">System</button>
      </div>
    </header>

    <form id="search" class="glass search">
      <input id="city" type="text" placeholder="Search city" autocomplete="off" />
      <button type="submit" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </button>
    </form>

    <section class="glass current">
      <h1 id="location">Boca Raton</h1>
      <div id="temp" class="temp">--°</div>
      <div id="condition" class="condition">Loading…</div>
      <div id="hilo" class="hilo"></div>
    </section>

    <section class="glass details">
      <div><span>Feels Like</span><strong id="feels">--</strong></div>
      <div><span>Humidity</span><strong id="humidity">--</strong></div>
      <div><span>Wind</span><strong id="wind">--</strong></div>
    </section>

    <section class="glass forecast">
      <h2>7-Day Forecast</h2>
      <ul id="days"></ul>
    </section>

    <p class="credit">Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
